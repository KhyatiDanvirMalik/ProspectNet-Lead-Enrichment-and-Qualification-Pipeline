<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProspectNet Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                <span class="logo-text">ProspectNet</span>
            </div>
            <span class="version">v1.0.0</span>
        </div>

        <div id="view-form" class="view-state active">
            <div id="error-alert" class="error-alert" style="display: none;"></div>
            
            <div class="form-group">
                <label for="input-name">Contact Name</label>
                <input type="text" id="input-name" placeholder="Extracting from page..." autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="input-company">Company / Domain</label>
                <input type="text" id="input-company" placeholder="Extracting from page..." autocomplete="off">
            </div>

            <input type="hidden" id="input-source" value="manual">
            
            <button id="btn-enrich" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                Enrich Lead
            </button>
        </div>

        <div id="view-loading" class="view-state">
            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-text">Running enrichment pipeline...</div>
            </div>
        </div>

        <div id="view-result" class="view-state">
            <div class="result-card">
                <div class="score-row">
                    <span class="score-label">ICP Fit Score</span>
                    <span id="result-score" class="score-badge">--</span>
                </div>
                
                <div class="signal-box">
                    <div class="signal-title">Top Buying Signal</div>
                    <div id="result-signal" class="signal-text">Processing...</div>
                </div>

                <div class="signal-box" style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="signal-title" style="margin-bottom: 0;">Outreach Drafts</div>
                    <div id="result-draft-status" class="status-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Generated
                    </div>
                </div>
            </div>
            
            <button id="btn-dashboard" class="btn" style="background-color: var(--surface); color: var(--text); border: 1px solid var(--border);">
                Open in Web App
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
